name: Verify public research edition
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.check_release
      - run: python -m pytest -q
      - run: python -m examples.reconciliation_demo
      - run: python -m examples.dated_join_demo
      - run: python -m examples.evaluator_audit_demo
      - run: python -m scripts.summarize_reconciliation
      - run: python -m scripts.replay_revenue_forecast
